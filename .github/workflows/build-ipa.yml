name: Build iOS IPA for SideStore

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build unsigned IPA
        run: |
          cd ios
          # The scheme is usually the project name (lowercase or CamelCase).
          # Let's dynamically find the workspace/scheme.
          PROJECT_NAME=$(ls *.xcworkspace | sed 's/\.xcworkspace//')
          
          # Build the archive without code signing
          xcodebuild archive \
            -workspace "${PROJECT_NAME}.xcworkspace" \
            -scheme "${PROJECT_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "../build/${PROJECT_NAME}.xcarchive" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          PROJECT_NAME=$(ls ios/*.xcworkspace | sed 's/ios\///' | sed 's/\.xcworkspace//')
          # Copy the .app from the archive to the Payload folder
          cp -r build/${PROJECT_NAME}.xcarchive/Products/Applications/${PROJECT_NAME}.app Payload/
          # Zip it into an IPA
          zip -r ${PROJECT_NAME}.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studici-ipa
          path: '*.ipa'
