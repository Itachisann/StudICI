name: Build iOS Dev Client (Testing)

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Configurazione build (Debug = Dev Client live reload con Metro; Release = test standalone)'
        required: true
        default: 'Debug'
        type: choice
        options:
          - 'Debug'
          - 'Release'
      publish_release:
        description: 'Pubblica come Pre-Release su GitHub Releases (tag: dev-client-latest)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - dev
      - testing

permissions:
  contents: write

jobs:
  build:
    name: Build iOS Dev Client IPA
    runs-on: macos-latest
    env:
      EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: 1
      FORCE_BUNDLING: 1
      CI: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup environment variables
        run: |
          echo "EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK=1" >> $GITHUB_ENV
          echo "FORCE_BUNDLING=1" >> $GITHUB_ENV
          echo "EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK=1" >> .env
          echo "FORCE_BUNDLING=1" >> .env
          if [ -n "${{ secrets.EXPO_PUBLIC_GEMINI_KEY }}" ]; then
            echo "EXPO_PUBLIC_GEMINI_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_KEY }}" >> .env
          fi

      - name: Install dependencies
        run: npm install

      - name: Configure app for Development / Testing
        env:
          BUILD_CONFIG: ${{ inputs.build_configuration || 'Debug' }}
        run: |
          node -e '
          const fs = require("fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          const isDebug = process.env.BUILD_CONFIG !== "Release";
          
          app.expo.name = isDebug ? "StudICI (Dev)" : "StudICI (Test)";
          app.expo.ios = app.expo.ios || {};
          app.expo.ios.bundleIdentifier = isDebug ? "com.vitor.studici.dev" : "com.vitor.studici.test";
          app.expo.ios.infoPlist = app.expo.ios.infoPlist || {};
          app.expo.ios.infoPlist.CFBundleDisplayName = isDebug ? "StudICI (Dev)" : "StudICI (Test)";
          app.expo.scheme = isDebug ? "studici-dev" : "studici-test";
          
          if (!app.expo.plugins) app.expo.plugins = [];
          if (!app.expo.plugins.some(p => (Array.isArray(p) ? p[0] : p) === "expo-dev-client")) {
            app.expo.plugins.unshift("expo-dev-client");
          }
          
          fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          console.log("Configured app.json:", {
            name: app.expo.name,
            bundleIdentifier: app.expo.ios.bundleIdentifier,
            displayName: app.expo.ios.infoPlist.CFBundleDisplayName,
            scheme: app.expo.scheme
          });
          '

      - name: Prebuild iOS native project
        run: npx expo prebuild --platform ios --clean

      - name: Build unsigned IPA
        env:
          BUILD_CONFIG: ${{ inputs.build_configuration || 'Debug' }}
        run: |
          export EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK=1
          export FORCE_BUNDLING=1
          cd ios
          
          PROJECT_NAME=$(basename -s .xcworkspace *.xcworkspace)
          echo "Building project: ${PROJECT_NAME} in configuration: ${BUILD_CONFIG}"
          
          xcodebuild archive \
            -workspace "${PROJECT_NAME}.xcworkspace" \
            -scheme "${PROJECT_NAME}" \
            -configuration "${BUILD_CONFIG}" \
            -sdk iphoneos \
            -archivePath "../build/${PROJECT_NAME}.xcarchive" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        env:
          BUILD_CONFIG: ${{ inputs.build_configuration || 'Debug' }}
        run: |
          mkdir -p Payload
          PROJECT_NAME=$(basename -s .xcworkspace ios/*.xcworkspace)
          cp -r "build/${PROJECT_NAME}.xcarchive/Products/Applications/${PROJECT_NAME}.app" Payload/
          
          OUTPUT_NAME="StudICI-DevClient.ipa"
          if [ "${BUILD_CONFIG}" = "Release" ]; then
            OUTPUT_NAME="StudICI-Testing.ipa"
          fi
          
          zip -r "${OUTPUT_NAME}" Payload
          echo "IPA_NAME=${OUTPUT_NAME}" >> $GITHUB_ENV
          echo "Successfully packaged: ${OUTPUT_NAME}"

      - name: Upload IPA as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Pre-Release & Update SideStore Dev Source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_CONFIG: ${{ inputs.build_configuration || 'Debug' }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG_NAME="dev-client-latest"
          RUN_ID="${{ github.run_id }}"
          TODAY=$(date +%Y-%m-%d)
          FILE_SIZE=$(wc -c < "${IPA_NAME}" | tr -d ' ')
          
          # Aggiorna apps-dev.json con la versione progressiva, data e dimensione
          node -e "
            const fs = require('fs');
            if (fs.existsSync('apps-dev.json')) {
              const data = JSON.parse(fs.readFileSync('apps-dev.json', 'utf8'));
              if (data.apps && data.apps[0]) {
                data.apps[0].size = Number('${FILE_SIZE}') || 31000000;
                data.apps[0].versionDate = '${TODAY}';
                data.apps[0].version = '${VERSION}-dev.' + '${RUN_ID}';
              }
              fs.writeFileSync('apps-dev.json', JSON.stringify(data, null, 2) + '\\n');
            }
          "
          
          # Se il file apps-dev.json è stato modificato, committalo sul branch dev con [skip ci]
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain apps-dev.json)" ]; then
            git add apps-dev.json
            git commit -m "chore(dev): update apps-dev.json metadata [skip ci]" || true
            git push origin HEAD || true
          fi
          
          cat << EOF > release_notes.md
          ## 🧪 StudICI Dev Client (Testing Build)
          
          - **Versione**: v${VERSION}-dev.${RUN_ID}
          - **Configurazione**: ${BUILD_CONFIG}
          - **File scaricabile**: \`${IPA_NAME}\`
          - **Bundle ID**: \`com.vitor.studici.dev\` (non sovrascrive la versione principale)
          - **Fonte SideStore**: \`https://raw.githubusercontent.com/Itachisann/StudICI/dev/apps-dev.json\`
          
          ---
          
          ### 📲 Come installare o aggiornare via SideStore:
          Aggiungi la fonte \`https://raw.githubusercontent.com/Itachisann/StudICI/dev/apps-dev.json\` nelle impostazioni **Sources** di SideStore.
          EOF
          
          # Se il tag esiste già, eliminalo per aggiornare la release
          gh release delete "$TAG_NAME" --cleanup-tag -y || true
          
          gh release create "$TAG_NAME" "${IPA_NAME}" \
            --title "StudICI Dev Client v${VERSION}-dev.${RUN_ID}" \
            --notes-file release_notes.md \
            --prerelease
